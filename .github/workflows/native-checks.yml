name: Native path checks

on:
  pull_request:
    paths:
      - app.json
      - app.config.js
      - eas.json
      - metro.config.js
      - package.json
      - package-lock.json
      - modules/alarmpyo-alarm/**
      - plugins/**
      - scripts/run-native-unit-tests.mjs
      - .github/workflows/native-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    name: Android native contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci
      - run: npm run test:android-native
