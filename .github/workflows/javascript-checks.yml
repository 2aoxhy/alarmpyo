name: JavaScript checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - run: npm ci
      - run: npm run assets:brand:check
      - run: npm run check
      - run: npm run audit:dependencies
        if: ${{ github.event_name != 'push' }}
      - run: npm run audit:tooling
        if: ${{ github.event_name != 'push' }}
