name: Weekly security audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-audit.yml'
      - '.node-version'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'dependency-security-policy.json'
      - 'docs/dependency-security-exceptions.md'
      - 'scripts/audit-dependencies.mjs'
      - 'scripts/__tests__/audit-dependencies.test.mjs'
      - 'scripts/__tests__/security-audit-workflow.test.mjs'
      - 'scripts/__tests__/*security.test.mjs'
      - 'tooling/uri-decoder-compat/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-audit.yml'
      - '.node-version'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'dependency-security-policy.json'
      - 'docs/dependency-security-exceptions.md'
      - 'scripts/audit-dependencies.mjs'
      - 'scripts/__tests__/audit-dependencies.test.mjs'
      - 'scripts/__tests__/security-audit-workflow.test.mjs'
      - 'scripts/__tests__/*security.test.mjs'
      - 'tooling/uri-decoder-compat/**'
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Production and tooling audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(npm --version)" = "11.13.0"
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Verify audit policy and dependency compatibility
        run: npm run test -- scripts/__tests__/audit-dependencies.test.mjs scripts/__tests__/security-audit-workflow.test.mjs scripts/__tests__/uri-decoder-security.test.mjs scripts/__tests__/metro-image-security.test.mjs
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:dependencies
      - name: Audit development tooling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:tooling
