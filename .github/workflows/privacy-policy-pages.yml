name: Publish privacy policy and signed patterns to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: alarmpyo-pages
  cancel-in-progress: false

jobs:
  build:
    name: Sign and package the public site
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: official-pattern-signing
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the selected default-branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate and stage the public privacy policy
        shell: bash
        run: |
          set -euo pipefail

          iconv -f UTF-8 -t UTF-8 public/privacy-policy.html >/dev/null
          grep -Fq '<meta charset="utf-8" />' public/privacy-policy.html
          grep -Fq '알람표 개인정보 처리방침' public/privacy-policy.html

          install -d -m 0755 _privacy-site
          install -m 0644 public/privacy-policy.html _privacy-site/index.html
          install -m 0644 public/privacy-policy.html _privacy-site/privacy-policy.html

          cmp -- public/privacy-policy.html _privacy-site/index.html
          cmp -- public/privacy-policy.html _privacy-site/privacy-policy.html

      - name: Sign the fixed official pattern files
        env:
          SHIFT_PATTERN_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.SHIFT_PATTERN_SIGNING_PRIVATE_KEY_PEM }}
        run: node scripts/sign-official-shift-patterns.mjs --output-dir _privacy-site

      - name: Verify the complete signed pattern set
        run: node scripts/verify-official-shift-patterns.mjs --directory _privacy-site

      - name: Verify the exact Pages artifact contents
        shell: bash
        run: |
          set -euo pipefail

          expected_files="$(printf '%s\n' humantss_a.json humantss_b.json humantss_c.json index.html privacy-policy.html)"
          actual_files="$(find _privacy-site -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"
          test -z "$(find _privacy-site -mindepth 1 ! -type f -print -quit)"
      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: _privacy-site
          retention-days: 1

  deploy:
    name: Publish the verified public site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
