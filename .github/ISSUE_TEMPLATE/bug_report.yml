name: 버그 신고
description: 재현 가능한 앱 문제를 알려 주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점이나 개인정보 노출은 공개 이슈에 쓰지 말고 SECURITY.md의 비공개 절차를 이용해 주세요.
  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 설정에 표시된 버전 또는 확인한 커밋을 적어 주세요.
      placeholder: 1.0.0(1) 또는 커밋 SHA
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 배포 형태
      options:
        - 개발 빌드
        - direct APK
        - Google Play
        - Expo Go 또는 웹
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기와 Android 버전
      placeholder: Galaxy S24, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 시작 상태부터 문제가 나타날 때까지 순서대로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 추가 자료
      description: 개인 정보·근무표·기기 식별자·비밀값을 가린 로그나 화면 기록만 첨부해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 같은 문제의 기존 이슈를 검색했어요.
          required: true
        - label: 이 이슈에 비밀값이나 실제 사용자 데이터를 포함하지 않았어요.
          required: true
