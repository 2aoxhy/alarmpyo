name: 기능 제안
description: 주간·교대 근무 흐름을 개선할 아이디어를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 목록보다 현재 어떤 사용자 흐름이 어려운지 설명해 주세요.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: 주 대상
      multiple: true
      options:
        - 주간 고정 근무자
        - 교대 근무자
        - 두 근무 방식 모두
        - 기여자 또는 배포 담당자
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 흐름
      description: 사용자가 어디에서 무엇을 선택하고 어떤 결과를 보는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: textarea
    id: impact
    attributes:
      label: 데이터·권한·접근성 영향
      description: 로컬 저장, 백업, 알람 권한, 320dp·큰 글자·TalkBack 영향을 알고 있다면 적어 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 같은 제안의 기존 이슈를 검색했어요.
          required: true
        - label: 계정·서버·분석 도입이 필요하다면 개인정보 영향을 설명했어요.
          required: true
